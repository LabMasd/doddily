# SearXNG for Little Days: local only, JSON API on, no rate limiter.
use_default_settings: true
server:
  secret_key: "little-days-local-only"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
search:
  safe_search: 0
  formats:
    - html
    - json
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
