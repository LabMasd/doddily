name: Build places from OpenStreetMap

# Monthly: parks, playgrounds, libraries, pools, soft play, farms, museums and baby change
# for the whole UK, so the apps don't query the public Overpass API.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 2 * *' # 03:00 UTC on the 2nd of each month

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download UK extract (Geofabrik)
        run: curl -fsSL --retry 3 -o uk.osm.pbf https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf

      - name: Filter and export
        run: |
          osmium tags-filter uk.osm.pbf \
            nwr/leisure=playground,park,indoor_play,sports_centre \
            nwr/amenity=library,toilets \
            nwr/tourism=zoo,museum \
            -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq \
            --add-unique-id=type_id \
            --format-option=print_record_separator=false \
            -o places.geojsonseq

      - name: Build tiles
        run: node scripts/build-places.mjs places.geojsonseq data/places

      - name: Commit updated places
        run: |
          git config user.name "little-days-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update places from OpenStreetMap"
          # Other commits may land during the ~10 minute build; replay ours on top.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
