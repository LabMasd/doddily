<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doddily</title>
<meta name="description" content="Baby and toddler activities near you, sorted by day, time and distance.">
<meta name="theme-color" content="#F4F6F8">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doddily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --milk:#F4F6F8; --card:#FFFFFF; --ink:#1E2536; --muted:#667085; --line:#DFE3E9;
  --accent:#C7B5F5; --accent-line:#8A6FD6; --accent-soft:#F0EAFE; --accent-text:#4B3A8C; --leaf:#2F7A52; --leaf-soft:#E3F2EA;
  --rain:#3D6FB6; --rain-soft:#E6EEF9;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --text:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:999px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--milk);color:var(--ink);font:16px/1.45 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px;border-radius:6px}
a{color:inherit}

.app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--milk);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}
.bar{display:flex;align-items:center;gap:10px}
.where{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:var(--r-sm);padding:10px 14px;box-shadow:0 0 0 1px var(--line) inset;text-align:left}
.where b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where span{color:var(--muted);white-space:nowrap}
.where .caret{margin-left:auto;color:var(--muted)}
.icon-btn{border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;border-radius:var(--r-sm);height:44px;min-width:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}

.week{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}
.day{border:0;background:transparent;border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.day small{font-size:12px;font-weight:500}
.day strong{font:700 20px/1.1 var(--display);color:var(--ink)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--ink)}
.day.any strong{font-size:15px;line-height:1.55}

.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:var(--r-sm);padding:8px 13px;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chip.toggle[aria-pressed="true"]{background:var(--leaf);}
.chip.toggle.rain[aria-pressed="true"]{background:var(--rain)}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

main{flex:1;display:grid;grid-template-columns:1fr;gap:0}
.list{padding:4px 16px calc(96px + var(--safe-b))}
.mapwrap{display:none}
body.show-map .list{display:none}
body.show-map .mapwrap{display:block;position:relative;height:calc(100dvh - 190px);margin:4px 16px calc(84px + var(--safe-b));border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#map{position:absolute;inset:0}
@media (min-width:900px){
  main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .list{padding-bottom:40px}
  .mapwrap,body.show-map .mapwrap{display:block;position:sticky;top:210px;height:calc(100dvh - 230px);margin:4px 16px 20px 0;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  body.show-map .list{display:block}
  .tabbar{display:none!important}
}

.summary{color:var(--muted);font-size:15px;margin:8px 0 6px}
.group-title{font:700 19px/1.2 var(--display);margin:22px 0 8px}
.group-title small{font:500 14px var(--text);color:var(--muted);margin-left:6px}

.item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.when{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;padding-top:2px;letter-spacing:-.01em}
.when small{display:block;font:500 13px/1.3 var(--text);color:var(--muted);margin-top:4px;letter-spacing:0}
.when.emoji{font-size:26px}
.item.past{opacity:.5}
.body{min-width:0}
.head{display:flex;gap:10px;align-items:flex-start}
.head h3{margin:0;font:600 17px/1.3 var(--text);flex:1;min-width:0}
.dist{flex:none;font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.venue{color:var(--muted);font-size:15px;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;font-weight:500;padding:3px 9px;border-radius:var(--r-sm);background:#EEF0F3;color:#3B4456}
.tag.free{background:var(--leaf-soft);color:var(--leaf)}
.tag.drop{background:var(--accent-soft);color:var(--accent-text)}
.tag.warn{background:#FBE9E7;color:#9A3412}
.more{border:0;background:none;padding:0;text-align:left;width:100%}
.detail{margin-top:12px;display:none}
.item.open .detail{display:block}
.detail p{margin:0 0 10px;font-size:15px}
.detail .meta{font-size:14px;color:var(--muted);margin-bottom:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{border:0;border-radius:var(--r-sm);padding:9px 14px;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:15px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act.primary{background:var(--ink);color:#fff;box-shadow:none}
.act.saved{background:var(--accent);box-shadow:none}

.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font:700 20px var(--display);margin:0 0 6px}
.foot{color:var(--muted);font-size:13px;margin:28px 0 0}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:30;display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(30,37,54,.25)}
.tabbar button{border:0;background:transparent;color:#C8CEDA;padding:10px 20px;border-radius:var(--r-sm);font-weight:600}
.tabbar button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,37,54,.35);z-index:40}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + var(--safe-b));max-width:560px;margin:0 auto;max-height:88dvh;overflow:auto}
@media (min-width:600px){.sheet{bottom:auto;top:10vh;border-radius:22px}}
.sheet h2{font:700 24px/1.2 var(--display);margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 18px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px}
.input{flex:1;min-width:0;border:0;box-shadow:0 0 0 1px var(--line) inset;border-radius:var(--r-md);padding:12px 14px;background:var(--milk);text-transform:uppercase}
.input.plain{text-transform:none}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:600;background:var(--ink);color:#fff}
.btn.ghost{background:var(--milk);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.wide{width:100%}
.range-row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--accent-line);height:32px}
.range-val{font:700 20px var(--display);min-width:64px;text-align:right}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.err{color:#9A3412;font-size:14px;margin-top:6px}

/* map markers */
.pin{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ink),0 3px 8px rgba(0,0,0,.2);display:grid;place-items:center;font-size:16px}
.pin.place{width:24px;height:24px;font-size:13px;box-shadow:0 0 0 1.5px #8A93A6}
.pin.home{background:var(--accent);box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.25)}
.leaflet-popup-content{font:15px/1.4 var(--text);margin:12px 14px}
.leaflet-popup-content b{display:block}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar">
      <button class="where" id="whereBtn" aria-label="Change location and distance">
        <span aria-hidden="true">📍</span><b id="whereName">Set your location</b><span id="whereRadius"></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <button class="icon-btn" id="savedBtn" aria-pressed="false" aria-label="Show saved">♥ <span id="savedCount"></span></button>
    </div>
    <nav class="week" id="week" aria-label="Pick a day"></nav>
    <div class="filters" id="filters" role="toolbar" aria-label="Filters"></div>
  </header>
  <main>
    <section class="list" id="list" aria-live="polite"></section>
    <div class="mapwrap"><div id="map" aria-label="Map of activities"></div></div>
  </main>
</div>
<div class="tabbar" role="tablist">
  <button id="tabList" aria-pressed="true">List</button>
  <button id="tabMap" aria-pressed="false">Map</button>
</div>
<div id="sheetRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
